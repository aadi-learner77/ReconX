services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconx_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-reconx}
    ports:
      - "5432:5432"
    volumes:
      - reconx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconx} -d ${POSTGRES_DB:-reconx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reconx}:${POSTGRES_PASSWORD:-reconx_local_dev}@db:5432/${POSTGRES_DB:-reconx}
      STORAGE_ROOT: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - reconx_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  reconx_pgdata:
  reconx_storage:
