services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconx_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-reconx}
    ports:
      - "5432:5432"
    volumes:
      - reconx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconx} -d ${POSTGRES_DB:-reconx}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26.2-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-reconx_neo4j_dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - reconx_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-reconx}:${POSTGRES_PASSWORD:-reconx_local_dev}@db:5432/${POSTGRES_DB:-reconx}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-reconx_neo4j_dev}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      GRAPH_BACKEND: ${GRAPH_BACKEND:-neo4j}
      STORAGE_ROOT: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - reconx_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  reconx_pgdata:
  reconx_storage:
  reconx_neo4j_data:
